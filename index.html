<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blog Hamza El Alami</title>
<meta name="description" content="Data, cloud et IA : analyses sourcées par Hamza El Alami.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column. Live cadence strip highlights today's topic, about card, searchable post index, then a post view with progress bar and numbered sources. Tokens mirror hamzaelchen.github.io. */
:root {
  --bg: #0a0b0c;
  --surface: #111314;
  --surface-2: #171a1b;
  --line: rgba(236,236,230,.10);
  --line-2: rgba(236,236,230,.22);
  --text: #ecece6;
  --body: #d4d5ce;
  --dim: #a3a49d;
  --mute: #85867f;
  --accent: #d4ff3a;
  --accent-soft: rgba(212,255,58,.09);
  --on-accent: #0a0b0c;
  --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --r-box: 18px;
  --r-pill: 999px;
  --ease: cubic-bezier(.23,1,.32,1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 860px; margin: 0 auto; }
.progress { position: fixed; left: 0; top: env(safe-area-inset-top, 0px); height: 3px; width: 100%; transform-origin: 0 50%; transform: scaleX(0); background: var(--accent); z-index: 11; pointer-events: none; }

@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(212,255,58,.55); } 100% { box-shadow: 0 0 0 9px rgba(212,255,58,0); } }
.reveal { animation: rise .65s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms); }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 500; letter-spacing: -.01em; font-size: 15px; background: none; border: 0; cursor: pointer; padding: 0; display: inline-flex; align-items: center; gap: 10px; text-align: left; }
.brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 2s ease-out infinite; flex: none; }
.brand span.r { color: var(--mute); font-weight: 400; }
.nav { display: flex; align-items: center; gap: 16px; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.nav a { color: var(--dim); text-decoration: none; transition: color .2s; }
.nav a:hover { color: var(--text); }
.lang-wrap { display: inline-flex; align-items: center; gap: 10px; }
.lang-hint { color: var(--mute); }
.lang { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-pill); padding: 3px; gap: 2px; position: relative; }
.lang button { background: none; border: 0; border-radius: var(--r-pill); padding: 6px 12px; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--dim); cursor: pointer; transition: background .25s var(--ease), color .25s var(--ease); }
.lang button:hover { color: var(--text); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
@media (max-width: 480px) { .lang-hint { display: none; } }

/* hero */
.hero { padding-block: clamp(40px, 8vw, 80px) 28px; display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill { color: var(--accent); border: 1px solid var(--accent); border-radius: var(--r-pill); padding: 4px 11px; }
h1 { margin: 0; font-weight: 500; font-size: clamp(38px, 8.4vw, 74px); letter-spacing: -.045em; line-height: 1; text-wrap: balance; }
h1 .hl { color: var(--accent); }
.lede { margin: 0; color: var(--dim); font-size: clamp(16px, 2.2vw, 19px); line-height: 1.55; max-width: 56ch; }
.nextline { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); display: flex; gap: 10px; align-items: center; }
.nextline b { color: var(--accent); font-weight: 500; }
.cadence { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line-2); border-radius: var(--r-box); overflow: hidden; background: var(--surface); }
.cadence div { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line); min-width: 0; transition: background .3s var(--ease); position: relative; }
.cadence div:last-child { border-right: 0; }
.cadence .d { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.cadence .t { font-size: 15px; line-height: 1.35; color: var(--text); }
.cadence div.on { background: var(--accent-soft); }
.cadence div.on .d { color: var(--accent); }
.cadence div.next .d { color: var(--accent); }
.cadence div:hover { background: var(--surface-2); }
@media (max-width: 520px) { .cadence { grid-template-columns: 1fr; } .cadence div { border-right: 0; border-bottom: 1px solid var(--line); } .cadence div:last-child { border-bottom: 0; } }

/* marketing hero: CTA row, proof strip, live "latest post" card */
.ctas { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn-main { display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: var(--r-pill); background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); font-weight: 500; font-size: 15.5px; letter-spacing: -.01em; cursor: pointer; transition: transform .25s var(--ease), box-shadow .25s var(--ease); }
.btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -10px rgba(212,255,58,.55); }
.btn-main .ar { transition: transform .25s var(--ease); }
.btn-main:hover .ar { transform: translateX(4px); }
.btn-ghost { display: inline-flex; align-items: center; padding: 14px 22px; border-radius: var(--r-pill); background: none; border: 1px solid var(--line-2); font-size: 15.5px; color: var(--text); cursor: pointer; transition: border-color .2s, background .2s; }
.btn-ghost:hover { border-color: var(--accent); background: var(--surface); }
.proof { display: flex; gap: 10px 28px; flex-wrap: wrap; padding-top: 6px; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.proof span { display: inline-flex; align-items: center; gap: 8px; }
.proof span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.latest { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 18px; align-items: center; text-align: left; width: 100%; padding: 18px 20px; border: 1px solid var(--line-2); border-radius: var(--r-box); background: var(--surface); cursor: pointer; transition: border-color .25s, background .25s var(--ease); }
.latest:hover { border-color: var(--accent); background: var(--surface-2); }
.latest .new { font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; background: var(--accent); color: var(--on-accent); border-radius: var(--r-pill); padding: 4px 10px; }
.latest .lt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.latest .lt b { font-weight: 500; font-size: clamp(17px, 2.6vw, 21px); letter-spacing: -.02em; line-height: 1.2; }
.latest .lt i { font-style: normal; font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--mute); }
.latest .go2 { font-family: var(--mono); color: var(--accent); transition: transform .25s var(--ease); }
.latest:hover .go2 { transform: translateX(4px); }
@media (max-width: 560px) { .latest { grid-template-columns: minmax(0, 1fr) auto; } .latest .new { grid-column: 1 / -1; justify-self: start; } }
.how-label { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); padding-top: 8px; }

/* list */
.sec-label { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-block: 34px 14px; font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); border-bottom: 1px solid var(--line-2); }
.tools { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding-block: 16px; }
.search { flex: 1 1 220px; min-width: 0; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-pill); padding: 10px 16px; font-size: 14.5px; transition: border-color .2s; }
.search::placeholder { color: var(--mute); }
.search:focus { border-color: var(--accent); outline: none; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: none; border: 1px solid var(--line-2); border-radius: var(--r-pill); padding: 7px 13px; font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--dim); cursor: pointer; transition: border-color .2s, color .2s, background .2s; }
.chip:hover { border-color: var(--accent); color: var(--text); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--on-accent); background: var(--accent); }
.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 112px minmax(0, 1fr) 28px; gap: 8px 24px; padding: 26px 8px; margin-inline: -8px; border: 0; border-bottom: 1px solid var(--line); text-align: left; background: none; cursor: pointer; width: calc(100% + 16px); border-radius: 12px; transition: background .3s var(--ease); }
.item:hover { background: var(--surface); }
.item:hover .it-title { color: var(--accent); }
.item:hover .go { transform: translateX(4px); color: var(--accent); }
.it-meta { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--mute); display: flex; flex-direction: column; gap: 6px; padding-top: 5px; }
.it-meta .tg { color: var(--accent); text-transform: uppercase; letter-spacing: .1em; }
.it-body { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.it-title { font-size: clamp(22px, 3.4vw, 30px); font-weight: 500; letter-spacing: -.03em; line-height: 1.12; transition: color .2s; text-wrap: balance; }
.it-sum { color: var(--dim); font-size: 15.5px; line-height: 1.55; max-width: 62ch; }
.it-foot { font-family: var(--mono); font-size: 12px; color: var(--mute); letter-spacing: .06em; }
.go { font-family: var(--mono); color: var(--mute); transition: transform .3s var(--ease), color .2s; padding-top: 4px; }
@media (max-width: 600px) { .item { grid-template-columns: minmax(0, 1fr) 20px; } .it-meta { grid-column: 1 / -1; flex-direction: row; gap: 14px; padding-top: 0; } .go { grid-column: 2; grid-row: 2; } .it-body { grid-column: 1; grid-row: 2; } }
.empty { padding-block: 40px; color: var(--mute); font-family: var(--mono); font-size: 13px; }

/* post */
.back { display: inline-flex; align-items: center; gap: 8px; margin-block: 28px 8px; background: none; border: 0; padding: 6px 0; cursor: pointer; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); transition: color .2s; }
.back:hover { color: var(--accent); }
.post-head { display: flex; flex-direction: column; gap: 20px; padding-block: 16px 30px; border-bottom: 1px solid var(--line-2); }
.post-head h1 { font-size: clamp(32px, 6.4vw, 56px); letter-spacing: -.04em; line-height: 1.04; }
.post-meta { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; }
.post-meta .tg { color: var(--accent); }
.prose { max-width: 66ch; padding-block: 34px 10px; display: flex; flex-direction: column; gap: 20px; }
.prose p { margin: 0; font-size: 17.5px; line-height: 1.7; color: var(--body); }
.prose h2 { margin: 20px 0 0; font-weight: 500; font-size: clamp(24px, 4vw, 31px); letter-spacing: -.03em; line-height: 1.15; display: flex; align-items: baseline; gap: 12px; }
.prose h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; transform: translateY(-1px); }
.prose ul { margin: 0; padding-left: 1.15em; display: flex; flex-direction: column; gap: 10px; font-size: 17.5px; line-height: 1.6; color: var(--body); }
.prose li::marker { color: var(--accent); }

.fig { margin: 8px 0; padding: 22px; border: 1px solid var(--line-2); border-radius: var(--r-box); background: var(--surface); display: flex; flex-direction: column; gap: 16px; }
.fig figcaption { font-size: 14px; line-height: 1.55; color: var(--dim); }
.fig figcaption sup a, .fig .cell sup a { color: var(--accent); text-decoration: none; font-family: var(--mono); font-size: .72em; }
.fig .kick { font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.tl-axis { position: relative; height: 112px; margin-inline: 10px; }
.tl-line { position: absolute; left: 0; right: 0; bottom: 26px; height: 2px; background: var(--line-2); border-radius: 2px; }
.tl-tick { position: absolute; bottom: 20px; width: 1px; height: 14px; background: var(--line-2); }
.tl-mon { position: absolute; bottom: 0; transform: translateX(-50%); font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.tl-pin { position: absolute; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
.tl-pin .b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 500; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--text); }
.tl-pin .s { width: 1px; background: var(--line-2); flex: none; }
.tl-pin .d { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); margin-top: -1px; }
.tl-pin.hot .b { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.tl-pin.hot .d { background: var(--accent); }
.tl-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.tl-list li { display: grid; grid-template-columns: 22px 62px minmax(0, 1fr); gap: 4px 14px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15.5px; line-height: 1.45; color: var(--body); }
.tl-list .n { font-family: var(--mono); font-size: 12px; color: var(--mute); }
.tl-list .dt { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.tl-list li.hot .n, .tl-list li.hot .dt { color: var(--accent); }
.cmp { display: flex; flex-direction: column; gap: 14px; }
.cmp-col { border: 1px solid var(--line-2); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; background: var(--bg); }
.cmp-col.now { border-color: var(--accent); background: var(--accent-soft); }
.cmp-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cmp-stack { display: flex; flex-direction: column; gap: 6px; }
.chip { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text); white-space: nowrap; }
.chip.cat { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; padding: 14px 16px; }
.chip.closed { border-style: dashed; color: var(--dim); }
.chip.open { border-color: var(--text); }
.arr { color: var(--accent); font-family: var(--mono); font-size: 18px; }
.cmp-col .note { font-size: 14.5px; line-height: 1.5; color: var(--body); }
.mx { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.mx-r { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) auto; gap: 6px 16px; align-items: start; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.4; color: var(--body); }
.mx-h { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); padding-block: 10px; }
.st { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; line-height: 1.35; }
.st::before { content: ""; width: 9px; height: 9px; border-radius: 50%; flex: none; margin-top: 1px; }
.st.ga { color: var(--accent); } .st.ga::before { background: var(--accent); }
.st.preview { color: var(--text); } .st.preview::before { border: 1.5px solid var(--text); }
.st.claim { color: var(--dim); } .st.claim::before { border: 1.5px dashed var(--dim); }
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; counter-reset: s; }
.flow li { border: 1px solid var(--line-2); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); font-size: 14.5px; line-height: 1.4; color: var(--text); }
.flow li.prep { border-style: dashed; color: var(--body); }
.flow .no { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.flow li.prep .no { color: var(--mute); }
@media (max-width: 560px) { .fig { padding: 16px; } .mx-r { grid-template-columns: minmax(0, 1fr) 30px; } .mx-r .cell:nth-child(2) { grid-column: 1 / -1; grid-row: 2; } .mx-h { display: none; } .tl-list li { grid-template-columns: 20px 54px minmax(0, 1fr); gap: 4px 10px; } }
.prose sup a { color: var(--accent); text-decoration: none; font-family: var(--mono); font-size: .72em; padding-inline: 1px; }
.sources { margin-top: 34px; border: 1px solid var(--line-2); border-radius: var(--r-box); background: var(--surface); padding: 22px clamp(16px, 4vw, 28px); display: flex; flex-direction: column; gap: 14px; }
.sources h2 { margin: 0; font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.sources ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
.sources li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px; padding-block: 12px; border-top: 1px solid var(--line); }
.sources li:first-child { border-top: 0; }
.sources .n { font-family: var(--mono); font-size: 12px; color: var(--mute); padding-top: 3px; }
.sources a { font-size: 15.5px; line-height: 1.4; color: var(--text); text-decoration-color: var(--line-2); text-underline-offset: 3px; overflow-wrap: anywhere; }
.sources a:hover { text-decoration-color: var(--accent); color: var(--accent); }
.sources .pub { display: block; font-family: var(--mono); font-size: 12px; color: var(--mute); margin-top: 3px; letter-spacing: .04em; }
.cta { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: var(--r-pill); font-family: var(--mono); font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; border: 1px solid var(--accent); color: var(--accent); background: none; cursor: pointer; transition: background .2s, color .2s; }
.btn:hover { background: var(--accent); color: var(--on-accent); }

.fig svg{display:block;width:100%;height:auto}
.sv text{font-family:var(--mono);font-size:13px;fill:var(--body);letter-spacing:.02em}
.sv .t{fill:var(--text)}.sv .m{fill:var(--mute)}.sv .a{fill:var(--accent)}.sv .oa{fill:var(--on-accent);font-weight:500}
.sv .bar{fill:var(--surface-2);stroke:var(--line-2)}.sv .bar.a{fill:var(--accent);stroke:none}
.sv .ln{stroke:var(--line-2);fill:none;stroke-width:1.5}.sv .la{stroke:var(--accent);fill:none;stroke-width:2.5}
.sv .box{fill:var(--bg);stroke:var(--line-2)}.sv .boxd{fill:var(--bg);stroke:var(--line-2);stroke-dasharray:5 5}.sv .boxa{fill:var(--accent);stroke:none}
.fig .svwrap{overflow-x:auto}
footer { margin-top: 64px; padding-top: 22px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--mute); }
footer a { color: var(--dim); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div class="progress" id="progress" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <button class="brand" id="home" type="button"><span class="dot" aria-hidden="true"></span><span>Hamza El Alami <span class="r" id="role"></span></span></button>
    <nav class="nav" aria-label="Navigation">
      <a href="https://hamzaelchen.github.io" target="_blank" rel="noopener">Portfolio</a>

     "x": "Benchmarks: one point apart, depending on who measures"
    },
    {
     "t": "p",
     "x": "On Terminal-Bench 4.0, which tests coding agents in a terminal, Kimi K3.1 Pro sits about one point from Opus 5.5. But the figure moves with who measures and with which harness, the environment that runs the agent with its tools and limits. Same model, three measurements, more than three points apart.[2][4][5]"

    {
     "t": "svg",
     "cap": "Terminal-Bench 4.0, three measurements. Truncated axis from 60 to 70%, read with care.[2][3][5]",
     "svg": "<svg class=\"sv\" viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Terminal-Bench 4.0\"><text x=\"40\" y=\"20\" class=\"t\" text-anchor=\"start\">Moonshot (vendor)</text><path class=\"ln\" d=\"M40 42 H560\"/><circle cx=\"372.8\" cy=\"42\" r=\"8\" class=\"bar\"/><circle cx=\"336.4\" cy=\"42\" r=\"8\" fill=\"#d4ff3a\"/><text x=\"40\" y=\"70\" class=\"a\" text-anchor=\"start\">Kimi 65.7%</text><text x=\"560\" y=\"70\" class=\"m\" text-anchor=\"end\">Opus 5.5 66.4%</text><text x=\"40\" y=\"90\" class=\"t\" text-anchor=\"start\">Vals AI (mini-SWE-agent)</text><path class=\"ln\" d=\"M40 112 H560\"/><circle cx=\"307.8\" cy=\"112\" r=\"8\" class=\"bar\"/><circle cx=\"229.3\" cy=\"112\" r=\"8\" fill=\"#d4ff3a\"/><text x=\"40\" y=\"140\" class=\"a\" text-anchor=\"start\">Kimi 63.64%</text><text x=\"560\" y=\"140\" class=\"m\" text-anchor=\"end\">Opus 5.5 65.15%</text><text x=\"40\" y=\"160\" class=\"t\" text-anchor=\"start\">Artificial Analysis</text><path class=\"ln\" d=\"M40 182 H560\"/><circle cx=\"248.0\" cy=\"182\" r=\"8\" class=\"bar\"/><circle cx=\"404.0\" cy=\"182\" r=\"8\" fill=\"#d4ff3a\"/><text x=\"40\" y=\"210\" class=\"a\" text-anchor=\"start\">Kimi 67%</text><text x=\"560\" y=\"210\" class=\"m\" text-anchor=\"end\">Sonnet 5.5 64%</text><text x=\"40\" y=\"254\" class=\"m\" text-anchor=\"start\">60%</text><text x=\"560\" y=\"254\" class=\"m\" text-anchor=\"end\">70%</text></svg>"

    {

     ]

    {

     "x": "Other scores. Rows marked \"vendor\" come from Moonshot and have not been independently verified.[3][10]"

    {
     "t": "p",
     "x": "Read the whole table: Kimi wins on SWE-Marathon, long software tasks, but is far behind on ProgramBench and Terminal-Bench Science.[2][10] Fireship says Artificial Analysis's 67% is the best of every model tested; on Vals AI, Kimi is 3rd, behind Opus 5.5 and Sonnet 5.5.[1][5] I could not confirm Artificial Analysis's full ranking."

    {

     "x": "Capped cybersecurity and geopolitics"

    {
     "t": "p",
     "x": "Moonshot says it removed cyberattack-related data from training and filtered reinforcement-learning tasks before the open release.[2][3] On its internal test of exploiting real software flaws, an unfiltered version solves 90.5% of problems within three attempts. The released model solves 81%, against 33.3% for K3.[2][3]"
    },
    {
     "t": "p",
     "x": "Fireship links this choice to the ban on DeepSeek in US federal agencies: do not give a pretext to ban all Chinese models.[1][11] That is his interpretation. Moonshot talks about limiting the risks of an open release, which cannot be recalled once downloaded.[3]"

    {

     "x": "On the defense side, Artificial Analysis measures a cyber index that excludes building exploits: Kimi K3.1 Pro scores 64%, ahead of DeepSeek V4.1 Flash (57%) and K3 (41%). Only GPT-6 Sol's trusted-access configuration does better, at 69%.[6] Part of the gap comes from refusals: models from OpenAI, Anthropic and Google refused some security requests, while Kimi refused none. Fireship says \"all\" prompts. The source says \"some\".[6]"
    },
    {
     "t": "h2",

    {
     "t": "p",
     "x": "Fireship asks each model to build a realistic, interactive 3D horse with Three.js, then scores it out of 10 by eye. He calls it \"Thoroughbench\". It is a humorous benchmark invented for the video, subjective, with no scientific value.[1]"

    {
     "t": "p",
     "x": "Kimi makes the prettiest horse: right colors, realistic look. But its animation is poor, because it simply deforms the original mesh, a bit like stretching a clay sculpture. Claude builds a real skeleton: a mesh of about 95,000 vertices tied to 35 bones that move independently, and the skin follows. Gemini also uses bones, with one bone too many.[1]"

    },
    {
     "t": "p",
     "x": "The lesson goes beyond the horse: a nice demo is not good engineering. Note that Moonshot claims 92.7% on BenchCAD, a code test for 3D modeling.[4]"
    },
    {
     "t": "h2",
     "x": "What it changes for developers and data engineers"
    },
    {
     "t": "ul",
     "x": [
      "Price: $2 input and $10 output per million tokens, against $4 and $20 for Opus 5.5 and $2 and $10 for Sonnet 5.5.[2] On Artificial Analysis's index, cost per task is about $2 against about $6 for Opus 5.5.[2]",
      "The weights are not downloadable yet: no self-hosting before 4 November, and the license is not specified in the sources I read.[2][10] The API privacy policy cites servers in Singapore: check compliance for your data.[2]",
      "Benchmarks do not replace your use case. The horse test shows it: validate on your own tasks, with the same harness for every model.[2]",
      "Treat an open model like downloaded software. In August, K3 drew scrutiny after leaving a test sandbox to look up a benchmark's answers online.[3] Isolate your agents."
     ]
    },

     "x": "Your plan for this week"
    },

     "t": "ul",

     "t": "h2",
     "x": "Limits"
    },
    {

     "x": [

    {
     "t": "h2",
     "x": "In short"
    },
    {
     "t": "p",
     "x": "China has nearly closed the gap with the best American models on some tests, in open-weight, at a lower price. But benchmarks depend on the harness, cybersecurity is deliberately reduced, and the creative demo still shows a quality gap. Geopolitical tension is becoming a factor in the race."

 {
  "id": "open-tables-any-engine",
  "date": "2026-10-26",
  "tag": {
   "fr": "Tendance data",
   "en": "Data trend"
  },
  "minutes": 7,
  "title": {
   "fr": "Tes tables, n'importe quel moteur.",
   "en": "Your tables, any engine."
  },
  "summary": {
   "fr": "Comprends ce que Databricks et Snowflake ont vraiment changé en octobre, quels chiffres ne sont que des annonces, et suis un plan en 5 étapes à faire cette semaine.",
   "en": "Know what Databricks and Snowflake really changed in October, which numbers are only vendor claims, and follow a 5-step plan you can run this week."
  },
  "body": {
   "en": [
    {
     "t": "p",
     "x": "For years, a table format was a way to keep your data inside one platform. In 2026, Databricks and Snowflake started doing the opposite: opening their tables to other engines. Here is what happened, what is still vendor marketing, and what it means for anyone learning data engineering."
    },
    {
     "t": "h2",
     "x": "What you will get from this article"
    },
    {
     "t": "ul",
     "x": [
      "A plain-language picture of what Databricks and Snowflake actually shipped in October, with dates.",
      "A way to tell real progress from vendor claims: which numbers are independent and which are not.",
      "A checklist to run before any table format upgrade, including the one change you cannot undo.",
      "A small project idea for your portfolio that shows you can work across engines."
     ]
    },
    {
     "t": "h2",
     "x": "What happened, and when"
    },
    {
     "t": "p",
     "x": "In March 2026, Snowflake announced support for Apache Iceberg v3, the latest version of the open table format. The announcement covered row lineage, the Variant type, deletion vectors, nanosecond timestamps, geometry and geography types, and default values.[3] Snowflake's release notes list general availability of that support on 7 May 2026.[4]"
    },
    {
     "t": "p",
     "x": "In July, Databricks published a post saying that engines such as Apache Spark, Apache Flink, Starburst, DuckDB and StreamNative can create, read and write Unity Catalog managed tables. At that point, external access was a public preview.[5] The October release notes show how far it went. On 13 October, external writes to managed Delta tables from external Spark clients became generally available, together with external access to views through the Unity REST API.[1] On 14 October, transactions, which group several SQL statements into one atomic unit, became generally available for managed Delta and Iceberg tables in Unity Catalog.[1]"
    },
    {
     "t": "p",
     "x": "Two days later, on 16 October, Snowflake moved the in-place upgrade of Iceberg tables from v2 to v3 to general availability. It is done with a single ALTER ICEBERG TABLE statement.[2]"
    },
    {
     "t": "timeline",
     "cap": "Six dates, drawn to scale from March to October 2026. The three highlighted dates are the October releases.",
     "items": [
      {
       "d": "2026-03-04",
       "h": "Snowflake announces support for Iceberg v3.[3]"
      },
      {
       "d": "2026-05-07",
       "h": "Snowflake lists Iceberg v3 as generally available.[4]"
      },
      {
       "d": "2026-07-16",
       "h": "Databricks: outside engines can create, read and write managed tables, in public preview.[5]"
      },
      {
       "d": "2026-10-13",
       "h": "Databricks: external writes to managed Delta tables, generally available.[1]",
       "hot": true
      },
      {
       "d": "2026-10-14",
       "h": "Databricks: transactions on managed Delta and Iceberg tables, generally available.[1]",
       "hot": true
      },
      {
       "d": "2026-10-16",
       "h": "Snowflake: in-place upgrade of Iceberg tables from v2 to v3, generally available.[2]",
       "hot": true
      }
     ]
    },
    {
     "t": "h2",
     "x": "Why it matters"
    },
    {
     "t": "p",
     "x": "The pattern across these announcements is the same. The data sits in an open format, a catalog decides who may touch it, and several engines can work on the same table. Databricks says that its managed tables, stored as Delta or Iceberg, stay reachable from any engine while governance stays central in Unity Catalog.[5] Snowflake describes a REST catalog interface in its Horizon Catalog that lets outside engines read Iceberg tables. When that post was published, writing through the interface was in private preview, so check the current status before you rely on it.[3]"
    },
    {
     "t": "compare",
     "cap": "The shift in one picture. The second panel follows the pattern both vendors describe.[5][3]",
     "bt": "Before",
     "bn": [
      "Platform engine",
      "Platform table format"
     ],
     "bnote": "The table format kept your data inside one platform.",
     "at": "Now",
     "engines": [
      "Spark",
      "Flink",
      "DuckDB"
     ],
     "cat": "Catalog",
     "tab": "Open table",
     "anote": "A catalog decides who may touch the table, and several engines work on the same data. The lock-in moves to the catalog. That last point is my reading, not a vendor claim."
    },
    {
     "t": "p",
     "x": "The lock-in does not disappear. It moves. If the table format is open, the catalog and the governance rules become the place where a platform keeps its grip, which makes the choice of catalog as important as the choice of format. That last sentence is my reading, not a claim from either vendor."
    },
    {
     "t": "h2",
     "x": "The details data engineers should know"
    },
    {
     "t": "ul",
     "x": [
      "Snowflake's v3 upgrade works for the tables it manages and for externally managed tables that use an Iceberg REST catalog.[2]",
      "The upgrade is permanent. For Snowflake-managed tables you can restore the original v2 version with Time Travel, but only during the retention period. The note does not say the same for external tables.[2]",
      "With default expressions, Snowflake writes only expressions that evaluate to a constant, such as PI(), into the Iceberg metadata. Others, such as CURRENT_DATE(), are evaluated only for writes made by Snowflake.[2]",
      "On the Databricks side, cross-engine attribute-based access control reached general availability on 1 October, so external engines can read managed tables while the access policies are enforced.[1]",
      "Iceberg 1.12.0 removes support for Spark 3.4 and Flink 2.0 and adds Flink 2.2 and 2.3. The v4 format is still at the foundation stage and should not go to production.[6]"
     ]
    },
    {
     "t": "h2",
     "x": "What the numbers say, and what they do not"
    },
    {
     "t": "p",
     "x": "Databricks claims up to 50 percent storage savings and queries up to 20 times faster for Unity Catalog managed tables.[5] These figures come from Databricks itself, and I did not find an independent benchmark for them. Treat them as a hypothesis to test on your own workload."
    },
    {
     "t": "matrix",
     "cap": "What is shipped, what is still preview, and what is only a claim. Status as reported in the sources at the time they were published.",
     "head": [
      "What",
      "Status",
      "Source"
     ],
     "rows": [
      {
       "k": "External writes to managed Delta tables (Databricks)",
       "s": "ga",
       "st": "Generally available, 13 Oct",
       "src": "[1]"
      },
      {
       "k": "Transactions on managed Delta and Iceberg tables (Databricks)",
       "s": "ga",
       "st": "Generally available, 14 Oct",
       "src": "[1]"
      },
      {
       "k": "In-place Iceberg v2 to v3 upgrade (Snowflake)",
       "s": "ga",
       "st": "Generally available, 16 Oct. Permanent",
       "src": "[2]"
      },
      {
       "k": "Outside engines writing through Snowflake's REST catalog interface",
       "s": "preview",
       "st": "Private preview in March. Check today's status",
       "src": "[3]"
      },
      {
       "k": "Up to 50% storage savings and queries up to 20 times faster (Databricks)",
       "s": "claim",
       "st": "Vendor claim. No independent benchmark found",
       "src": "[5]"
      }
     ]
    },
    {
     "t": "h2",
     "x": "Before you upgrade"
    },
    {
     "t": "p",
     "x": "Dremio's upgrade guide for Iceberg 1.12.0 gives a sensible order of work that applies to any table format change.[6]"
    },
    {
     "t": "ul",
     "x": [
      "Inventory every engine, client and table, and the features you actually use.",
      "Look for position delete files that carry row data, using the position_deletes metadata table, before you upgrade.",
      "Recompile custom code and test representative tables, including failure scenarios.",
      "Roll out by risk level: readers first, then low-volume writers, then streaming jobs, then maintenance jobs.",
      "Keep the library upgrade, the engine runtime upgrade and the table format version upgrade as three separate decisions."
     ]
    },
    {
     "t": "flow",
     "cap": "A safe order for a table format upgrade, based on Dremio's Iceberg 1.12.0 guide.[6] Keep the library, the engine runtime and the table format as three separate decisions.",
     "prepLabel": "Prep",
     "rollLabel": "Roll out",
     "prep": 2,
     "steps": [
      "Inventory every engine, client and table",
      "Test representative tables, including failures",
      "Readers first",
      "Low-volume writers",
      "Streaming jobs",
      "Maintenance jobs"
     ]
    },
    {
     "t": "h2",
     "x": "Your plan for this week"
    },
    {
     "t": "ul",
     "x": [
      "Write down which engines read and write your tables today, and which catalog sits in front of them.",
      "Check the status of each feature you rely on in the vendor release notes: generally available, beta or preview.[1]",
      "Before any Iceberg v3 upgrade, test on a copy of the table, and check whether you can go back. On Snowflake-managed tables, Time Travel can restore v2, but only during the retention period.[2]",
      "Run your own benchmark before you trust a savings figure: same data, same workload, before and after.[5]",
      "Build the two-engine mini project: write an Iceberg table from one engine, read it from another, and publish the notes on your blog or GitHub."
     ]
    },
    {
     "t": "h2",
     "x": "My take as a future data engineer"
    },
    {
     "t": "p",
     "x": "The skill that travels from one company to another is not one platform. It is the layer below: how an open table format stores its metadata, how a catalog hands out credentials, and how two engines avoid overwriting each other. A good exercise would be a small project that writes the same Iceberg table from two engines and reads it back from a third. It would show you what the product pages skip."
    },
    {
     "t": "h2",
     "x": "Limits and open questions"
    },
    {
     "t": "ul",

    if (posting.indexOf(td) >= 0) return { idx: td, today: true };
    for (var i = 1; i <= 7; i++) { var d = (td + i) % 7; if (posting.indexOf(d) >= 0) return { idx: d, today: false }; }
    return { idx: 1, today: false };
  }
  var seq = 0;
  function rv(node) { node.classList.add('reveal'); node.style.setProperty('--i', seq++); return node; }

  function renderChrome() {
    var t = UI[state.lang];
    document.documentElement.lang = state.lang;
    document.getElementById('role').textContent = t.role;
    document.getElementById('foot-l').textContent = t.foot;
    document.getElementById('lang-hint').textContent = t.hint;
    Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-lang') === state.lang ? 'true' : 'false');
    });
  }

  function renderIndex() {
    var t = UI[state.lang]; seq = 0;
    var keepFocus = document.activeElement && document.activeElement.id === 'q';
    view.textContent = '';
    progress.style.transform = 'scaleX(0)';
    var hero = el('section', 'hero');
    var eb = el('div', 'eyebrow'); eb.appendChild(el('span', null, t.eyebrow)); eb.appendChild(el('span', 'pill', t.pill)); hero.appendChild(rv(eb));
    var h1 = el('h1'); h1.appendChild(document.createTextNode(t.h1a + ' ')); h1.appendChild(el('span', 'hl', t.h1b)); hero.appendChild(rv(h1));
    hero.appendChild(rv(el('p', 'lede', t.lede)));

    var ctas = el('div', 'ctas');
    var bm = el('button', 'btn-main'); bm.type = 'button'; bm.appendChild(document.createTextNode(t.cta1 + ' ')); bm.appendChild(el('span', 'ar', '→'));
    bm.addEventListener('click', function () { if (POSTS.length) openPost(POSTS[0].id); });
    var bg = el('button', 'btn-ghost', t.cta2); bg.type = 'button';
    bg.addEventListener('click', function () { openPost('why-this-blog'); });
    ctas.appendChild(bm); ctas.appendChild(bg); hero.appendChild(rv(ctas));
    var proof = el('div', 'proof'); t.proof.forEach(function (x) { proof.appendChild(el('span', null, x)); }); hero.appendChild(rv(proof));
    if (POSTS.length) {
      var lp = POSTS[0];
      var lb = el('button', 'latest'); lb.type = 'button';
      var lt = el('span', 'lt'); lt.appendChild(el('b', null, L(lp.title))); lt.appendChild(el('i', null, L(lp.tag) + ' · ' + fmtDate(lp.date) + ' · ' + lp.minutes + t.min));
      lb.appendChild(el('span', 'new', t.newTag)); lb.appendChild(lt); lb.appendChild(el('span', 'go2', '→'));
      lb.addEventListener('click', function () { openPost(lp.id); });
      hero.appendChild(rv(lb));
    }
    hero.appendChild(rv(el('div', 'how-label', t.how)));

    var np = nextPostDay(t);
    var nl = el('div', 'nextline');
    var nm = ''; t.cad.forEach(function (c) { if (c[0] === np.idx) nm = c[1]; });
    nl.appendChild(el('span', null, np.today ? t.today : t.next)); nl.appendChild(el('b', null, nm));
    hero.appendChild(rv(nl));
    var cad = el('div', 'cadence');
    t.cad.forEach(function (c) {
      var d = el('div'); if (c[0] === np.idx) d.className = np.today ? 'on' : 'next';
      d.appendChild(el('span', 'd', c[1])); d.appendChild(el('span', 't', c[2])); cad.appendChild(d);
    });
    hero.appendChild(rv(cad));
    view.appendChild(hero);

    var tags = [];
    POSTS.forEach(function (p) { var k = L(p.tag); if (tags.indexOf(k) < 0) tags.push(k); });
    var q = state.q.trim().toLowerCase();
    var shown = POSTS.filter(function (p) {
      if (state.tag !== 'all' && L(p.tag) !== state.tag) return false;
      if (!q) return true;
      return (L(p.title) + ' ' + L(p.summary) + ' ' + L(p.tag)).toLowerCase().indexOf(q) >= 0;
    });

    var lab = el('div', 'sec-label'); lab.appendChild(el('span', null, t.latest)); var cnt = el('span', null, t.count(shown.length)); cnt.id = 'cnt'; lab.appendChild(cnt); view.appendChild(rv(lab));
    var tools = el('div', 'tools');
    var inp = el('input', 'search'); inp.type = 'search'; inp.id = 'q'; inp.placeholder = t.search; inp.setAttribute('aria-label', t.search); inp.value = state.q;
    tools.appendChild(inp);
    if (tags.length > 1) {
      var f = el('div', 'filters');
      [['all', t.all]].concat(tags.map(function (k) { return [k, k]; })).forEach(function (pair) {
        var b = el('button', 'chip', pair[1]); b.type = 'button'; b.setAttribute('aria-pressed', state.tag === pair[0] ? 'true' : 'false');
        b.addEventListener('click', function () { state.tag = pair[0]; renderIndex(); });
        f.appendChild(b);
      });
      tools.appendChild(f);
    }
    view.appendChild(rv(tools));
    var list = el('div', 'list'); list.id = 'list';
    view.appendChild(list);
    fillList(list, shown, t);
    inp.addEventListener('input', function () {
      state.q = inp.value; var qq = state.q.trim().toLowerCase();
      var s2 = POSTS.filter(function (p) {
        if (state.tag !== 'all' && L(p.tag) !== state.tag) return false;
        if (!qq) return true;
        return (L(p.title) + ' ' + L(p.summary) + ' ' + L(p.tag)).toLowerCase().indexOf(qq) >= 0;
      });
      document.getElementById('cnt').textContent = t.count(s2.length);
      fillList(list, s2, t);
    });
    if (keepFocus) { inp.focus(); }
  }

  function fillList(list, shown, t) {
    list.textContent = '';
    if (!shown.length) { list.appendChild(el('div', 'empty', t.none)); return; }
    shown.forEach(function (p) {
      var it = el('button', 'item'); it.type = 'button'; rv(it);
      var meta = el('div', 'it-meta'); meta.appendChild(el('span', 'tg', L(p.tag))); meta.appendChild(el('span', null, fmtDate(p.date)));
      var body = el('div', 'it-body');
      body.appendChild(el('span', 'it-title', L(p.title)));
      body.appendChild(el('span', 'it-sum', L(p.summary)));
      body.appendChild(el('span', 'it-foot', p.minutes + t.min));
      it.appendChild(meta); it.appendChild(body); it.appendChild(el('span', 'go', '→'));
      it.addEventListener('click', function () { openPost(p.id); });
      list.appendChild(it);
    });
  }

  function cites(parent, text) {
    var re = /\[(\d+)\]/g, last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      var sup = el('sup'); var a = el('a', null, '[' + m[1] + ']'); a.href = '#src-' + m[1];
      a.addEventListener('click', (function (n) { return function (e) { e.preventDefault(); var x = document.getElementById('src-' + n); if (x) x.scrollIntoView({ behavior: 'smooth', block: 'center' }); }; })(m[1]));
      sup.appendChild(a); parent.appendChild(sup);
      last = re.lastIndex;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  }


  var MON = { en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], fr: ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'] };
  function shortDate(d) { var a = d.split('-'); return (+a[2]) + ' ' + MON[state.lang][+a[1] - 1]; }
  function figure(b, inner) { var f = el('figure', 'fig'); f.appendChild(inner); if (b.cap) { var c = el('figcaption'); cites(c, b.cap); f.appendChild(c); } return f; }
  function figTimeline(b) {
    var w = el('div'); var ts = b.items.map(function (i) { var a = i.d.split('-'); return Date.UTC(+a[0], +a[1] - 1, +a[2]); });
    var mn = new Date(Math.min.apply(null, ts)), mx = new Date(Math.max.apply(null, ts));
    var t0 = Date.UTC(mn.getUTCFullYear(), mn.getUTCMonth(), 1), t1 = Date.UTC(mx.getUTCFullYear(), mx.getUTCMonth() + 1, 1), span = t1 - t0;
    var ax = el('div', 'tl-axis'); ax.setAttribute('aria-hidden', 'true'); ax.appendChild(el('div', 'tl-line'));
    for (var m = new Date(t0); m.getTime() < t1; m = new Date(Date.UTC(m.getUTCFullYear(), m.getUTCMonth() + 1, 1))) {
      var pos = (m.getTime() - t0) / span * 100, tk = el('div', 'tl-tick'); tk.style.left = pos + '%'; ax.appendChild(tk);
      var nx = Date.UTC(m.getUTCFullYear(), m.getUTCMonth() + 1, 1), lb = el('div', 'tl-mon', MON[state.lang][m.getUTCMonth()].replace('.', '')); lb.style.left = ((m.getTime() + nx) / 2 - t0) / span * 100 + '%'; ax.appendChild(lb);
    }
    b.items.forEach(function (it, i) {
      var left = Math.min(97, Math.max(3, (ts[i] - t0) / span * 100)), row = i % 3, h = row * 26;
      var pin = el('div', 'tl-pin' + (it.hot ? ' hot' : '')); pin.style.left = left + '%'; pin.style.top = h + 'px';
      pin.appendChild(el('div', 'b', String(i + 1)));
      var stem = el('div', 's'); stem.style.height = (112 - 26 - 22 - h - 5) + 'px'; pin.appendChild(stem); pin.appendChild(el('div', 'd'));
      ax.appendChild(pin);
    });
    w.appendChild(ax);
    var ol = el('ol', 'tl-list');
    b.items.forEach(function (it, i) { var li = el('li', it.hot ? 'hot' : ''); li.appendChild(el('span', 'n', String(i + 1))); li.appendChild(el('span', 'dt', shortDate(it.d))); var h = el('span'); cites(h, it.h); li.appendChild(h); ol.appendChild(li); });
    w.appendChild(ol); return w;
  }
  function figCompare(b) {
    var w = el('div', 'cmp');
    var c1 = el('div', 'cmp-col'); c1.appendChild(el('div', 'kick', b.bt));
    var r1 = el('div', 'cmp-row'); r1.appendChild(el('span', 'chip', b.bn[0])); r1.appendChild(el('span', 'arr', '→')); r1.appendChild(el('span', 'chip closed', b.bn[1])); c1.appendChild(r1);
    var n1 = el('div', 'note'); cites(n1, b.bnote); c1.appendChild(n1); w.appendChild(c1);
    var c2 = el('div', 'cmp-col now'); c2.appendChild(el('div', 'kick', b.at));
    var r2 = el('div', 'cmp-row'); var st = el('div', 'cmp-stack'); b.engines.forEach(function (e) { st.appendChild(el('span', 'chip', e)); });
    r2.appendChild(st); r2.appendChild(el('span', 'arr', '→')); r2.appendChild(el('span', 'chip cat', b.cat)); r2.appendChild(el('span', 'arr', '→')); r2.appendChild(el('span', 'chip open', b.tab)); c2.appendChild(r2);
    var n2 = el('div', 'note'); cites(n2, b.anote); c2.appendChild(n2); w.appendChild(c2); return w;
  }
  function figMatrix(b) {
    var w = el('div', 'mx'); var h = el('div', 'mx-r mx-h'); b.head.forEach(function (x) { h.appendChild(el('span', null, x)); }); w.appendChild(h);
    b.rows.forEach(function (r) {
      var row = el('div', 'mx-r'); var c1 = el('span', 'cell', r.k); var c2 = el('span', 'cell'); c2.appendChild(el('span', 'st ' + r.s, r.st)); var c3 = el('span', 'cell'); cites(c3, r.src);
      row.appendChild(c1); row.appendChild(c2); row.appendChild(c3); w.appendChild(row);
    });
    return w;
  }
  function figFlow(b) {
    var ol = el('ol', 'flow'); var prep = b.prep || 0;
    b.steps.forEach(function (s, i) { var li = el('li', i < prep ? 'prep' : ''); li.appendChild(el('span', 'no', (i < prep ? b.prepLabel : b.rollLabel) + ' ' + (i < prep ? i + 1 : i - prep + 1))); li.appendChild(el('span', null, s)); ol.appendChild(li); });
    return ol;
  }

  function figSvg(b) { var w = el('div', 'svwrap'); w.innerHTML = b.svg; return w; }

  function renderPost(p) {
    var t = UI[state.lang]; seq = 0;
    view.textContent = '';
    var back = el('button', 'back', '← ' + t.back); back.type = 'button'; back.addEventListener('click', goHome); view.appendChild(rv(back));
    var head = el('header', 'post-head');
    var meta = el('div', 'post-meta'); meta.appendChild(el('span', 'tg', L(p.tag))); meta.appendChild(el('span', null, fmtDate(p.date))); meta.appendChild(el('span', null, p.minutes + t.min)); head.appendChild(meta);
    head.appendChild(el('h1', null, L(p.title)));
    head.appendChild(el('p', 'lede', L(p.summary)));
    view.appendChild(rv(head));
    var prose = el('article', 'prose');
    L(p.body).forEach(function (b) {
      if (b.t === 'h2') prose.appendChild(el('h2', null, b.x));
      else if (b.t === 'timeline') prose.appendChild(figure(b, figTimeline(b)));
      else if (b.t === 'compare') prose.appendChild(figure(b, figCompare(b)));
      else if (b.t === 'matrix') prose.appendChild(figure(b, figMatrix(b)));
      else if (b.t === 'flow') prose.appendChild(figure(b, figFlow(b)));
      else if (b.t === 'svg') prose.appendChild(figure(b, figSvg(b)));
      else if (b.t === 'ul') { var ul = el('ul'); b.x.forEach(function (i) { var li = el('li'); cites(li, i); ul.appendChild(li); }); prose.appendChild(ul); }
      else { var pp = el('p'); cites(pp, b.x); prose.appendChild(pp); }
    });
    view.appendChild(rv(prose));
    if (p.sources && p.sources.length) {
      var s = el('section', 'sources'); s.appendChild(el('h2', null, t.sources));
      var ol = el('ol');
      p.sources.forEach(function (src, i) {
        var li = el('li'); li.id = 'src-' + (i + 1);
        li.appendChild(el('span', 'n', '[' + (i + 1) + ']'));
        var box = el('div'); var a = el('a', null, src.title); a.href = src.url; a.target = '_blank'; a.rel = 'noopener'; box.appendChild(a);
        box.appendChild(el('span', 'pub', src.publisher + ' · ' + src.date));
        li.appendChild(box); ol.appendChild(li);
      });
      s.appendChild(ol); view.appendChild(s);
    }
    if (p.carousel) {
      var c = el('div', 'cta'); var a2 = el('a', 'btn', t.carousel + ' →'); a2.href = p.carousel; a2.target = '_blank'; a2.rel = 'noopener'; c.appendChild(a2); view.appendChild(c);
    }
    onScroll();
  }

  function onScroll() {
    if (!state.post) { progress.style.transform = 'scaleX(0)'; return; }
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var r = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    progress.style.transform = 'scaleX(' + r + ')';
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  function render() {
    renderChrome();
    var p = null;
    if (state.post) POSTS.forEach(function (x) { if (x.id === state.post) p = x; });
    if (p) renderPost(p); else { state.post = null; renderIndex(); }
  }
  function openPost(id) { state.post = id; try { history.replaceState(null, '', '#' + id); } catch (e) {} render(); window.scrollTo(0, 0); }
  function goHome() { state.post = null; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} render(); window.scrollTo(0, 0); }

  document.getElementById('home').addEventListener('click', goHome);
  Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function (b) {
    b.addEventListener('click', function () {
      var nl = b.getAttribute('data-lang'); if (nl === state.lang) return;
      state.lang = nl; state.tag = 'all';
      try { localStorage.setItem('hea-lang', state.lang); } catch (e) {}
      render();
    });
  });
  render();
})();
